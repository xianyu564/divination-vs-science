# Site configuration for GitHub Pages
title: "玄学与科学 / Divination vs Science"
description: "Philosophical Framework and Applications - Exploring the relationship between traditional wisdom and modern science / 哲学框架与应用 - 探索传统智慧与现代科学的关系"
url: "https://xianyu564.github.io"
baseurl: "/divination-vs-science"
lang: "zh-CN"

# Author information
author:
  name: "Ziyang Zhang (Xianyu)"
  email: "z_zz@u.nus.edu"
  github: "xianyu564"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO settings
twitter:
  username: xianyu564
  card: summary_large_image

logo: "/assets/images/logo.png"

# Social links for structured data
social:
  name: "玄学与科学 / Divination vs Science"
  links:
    - https://github.com/xianyu564/divination-vs-science
    - https://github.com/xianyu564

# Multilingual support
languages: ["zh-CN", "zh-TW", "en"]
default_lang: "zh-CN"

# Collections for structured content
collections:
  lectures:
    output: true
    permalink: /:collection/:name/
  faq:
    output: true
    permalink: /:collection/:name/
  glossary:
    output: true
    permalink: /:collection/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "zh-CN"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      lang: "zh-CN"
  - scope:
      path: "en"
    values:
      lang: "en"
  - scope:
      path: "zh-tw"
    values:
      lang: "zh-TW"

# Exclude files from processing
exclude:
  - .github/
  - node_modules/
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - README.md
  - README_EN.md